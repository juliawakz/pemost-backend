<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification Code</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">

    <table role="presentation" cellspacing="0" cellpadding="0" width="100%" style="margin: auto; max-width: 600px;">
        <tr>
            <td style="background-color: #0c2959; text-align: center; padding: 20px;">
                <h2 style="color: #ffffff;">Account Verification Code</h2>
            </td>
        </tr>
        <tr>
            <td style="padding: 20px; background-color: #ffffff;">
                <p>Dear {{ user }},</p>
                <p>To verify your account, please use the following code:</p>
                <h3 style="color: #0c2959; font-size: 24px; text-align: center; margin-top: 20px;"><span style="color: darkblue; user-select: all;">{{ otp }}</span></h3>
                <p style="text-align: center; margin-top: 20px;">This code will expire after one hour.</p>
                <p style="text-align: center; margin-top: 20px;">Best regards,<br>PEMOST Team</p>
            </td>
        </tr>
        <tr>
            <td style="text-align: center; padding: 10px; background-color: #0c2959; color: #ffffff;">
                <p>&copy; 2025 PEMOST Solution Limited. All rights reserved.</p>
            </td>
        </tr>
    </table>

</body>

</html>
