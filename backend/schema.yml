        Only E-Extensions can create requests to Super Extensions.
      properties:
        super_extension:
          type: string
          format: uuid
        message:
          type: string
          nullable: true
          description: Optional message from e-extension to super extension
      required:
      - super_extension
    EExtensionWorkRequestRead:
      type: object
      description: |-
        Serializer for reading/retrieving E-Extension work requests.
        Includes nested e-extension and super-extension user information.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        e_extension:
          allOf:
          - $ref: '#/components/schemas/UserRead'
          readOnly: true
        super_extension:
          allOf:
          - $ref: '#/components/schemas/UserRead'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkRequestStatusChoices'
          readOnly: true
        message:
          type: string
