          type: boolean
          readOnly: true
          description: Whether email notification has been sent
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the request was accepted or rejected
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - e_extension
      - id
      - notification_sent
      - responded_at
      - response_message
      - status
      - super_extension
      - updated_at
    FarmRead:
      type: object
      description: |-
        Serializer for reading/retrieving farm data.
        Includes nested user and ward information, and calculated size.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 250
        boundary:
          type: object
          properties:
            type:
              type: string
              enum:
              - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
                    format: float
                  example:
                  - 12.9721
                  - 77.5933
                  minItems: 2
                  maxItems: 3
                example:
                - - 22.4707
                  - 70.0577
                - - 12.9721
                  - 77.5933
                minItems: 4
              example:
              - - - 0.0
                  - 0.0
                - - 0.0
                  - 50.0
                - - 50.0
                  - 50.0
                - - 50.0
                  - 0.0
                - - 0.0
                  - 0.0
        user_size:
          type: number
          format: double
          minimum: 0
          nullable: true
        calc_size:
          type: number
          format: double
          readOnly: true
          nullable: true
        ward:
          allOf:
          - $ref: '#/components/schemas/MiniWard'
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserRead'
          readOnly: true
        e_extensions_count:
          type: integer
          readOnly: true
        is_visible:
          type: boolean
          description: If True, farmer is visible to allowed e-extension officers
            in their ward
        is_archived:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - boundary
      - calc_size
      - created_at
      - e_extensions_count
      - id
      - is_archived
      - name
      - updated_at
      - user
      - ward
    FarmUpdate:
      type: object
      description: |-
        Serializer for updating farm data.
        Only allows updating: name, boundary, and user_size.
      properties:
        name:
          type: string
          maxLength: 250
        boundary:
          type: object
          properties:
            type:
              type: string
              enum:
              - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
                    format: float
                  example:
                  - 12.9721
                  - 77.5933
                  minItems: 2
                  maxItems: 3
                example:
                - - 22.4707
                  - 70.0577
                - - 12.9721
                  - 77.5933
                minItems: 4
              example:
              - - - 0.0
                  - 0.0
                - - 0.0
                  - 50.0
                - - 50.0
                  - 50.0
                - - 50.0
                  - 0.0
                - - 0.0
                  - 0.0
        user_size:
          type: number
          format: double
          minimum: 0
          nullable: true
      required:
      - boundary
      - name
    FarmUpdateRequest:
      type: object
      description: |-
        Serializer for updating farm data.
        Only allows updating: name, boundary, and user_size.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 250
        boundary:
          type: object
          properties:
            type:
              type: string
              enum:
              - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
                    format: float
                  example:
                  - 12.9721
                  - 77.5933
                  minItems: 2
                  maxItems: 3
