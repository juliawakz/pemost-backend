            application/json:
              schema:
                $ref: '#/components/schemas/AgrodealerUpdate'
          description: ''
    patch:
      operationId: api_v2_app_agrodealers_partial_update
      description: Partially update an agrodealer profile (PATCH).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Agro Dealer.
        required: true
      tags:
      - App - Agrodealers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgrodealerUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgrodealerUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgrodealerUpdateRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgrodealerUpdate'
          description: ''
    delete:
      operationId: api_v2_app_agrodealers_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Agro Dealer.
        required: true
      tags:
      - App - Agrodealers
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
