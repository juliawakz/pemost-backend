                - - 22.4707
                  - 70.0577
                - - 12.9721
                  - 77.5933
                minItems: 4
              example:
              - - - 0.0
                  - 0.0
                - - 0.0
                  - 50.0
                - - 50.0
                  - 50.0
                - - 50.0
                  - 0.0
                - - 0.0
                  - 0.0
        user_size:
          type: number
          format: double
          minimum: 0
          nullable: true
      required:
      - boundary
      - name
    FarmWrite:
      type: object
      description: |-
        Serializer for creating new farms.
        Requires: name, boundary, ward, user.
        Optional: user_size (farmer's estimated size).
      properties:
        name:
          type: string
          maxLength: 250
        boundary:
          type: object
