              $ref: '#/components/schemas/AgrodealerUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgrodealerUpdateRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
