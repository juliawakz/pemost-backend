components:
  schemas:
    AcceptRejectRequestRequest:
      type: object
      description: Serializer for accepting or rejecting work requests.
      properties:
        response_message:
          type: string
          maxLength: 500
    AgrodealerRead:
      type: object
      description: |-
        Serializer for reading/retrieving agrodealer data.
        Includes nested user and ward information, and location details.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 30
        user:
          allOf:
          - $ref: '#/components/schemas/UserRead'
          readOnly: true
        ward:
          allOf:
          - $ref: '#/components/schemas/MiniWard'
          readOnly: true
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        address:
          type: string
          readOnly: true
          nullable: true
        is_visible:
          type: boolean
        is_archived:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - id
      - is_archived
      - latitude
      - location
      - longitude
      - name
      - updated_at
      - user
      - ward
    AgrodealerUpdate:
      type: object
      description: |-
        Serializer for updating agrodealer data.
        Allows updating: name, ward, location, is_visible.
      properties:
        name:
          type: string
          maxLength: 30
        ward:
          type: string
          format: uuid
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        is_visible:
          type: boolean
      required:
      - location
      - name
      - ward
    AgrodealerUpdateRequest:
      type: object
      description: |-
        Serializer for updating agrodealer data.
        Allows updating: name, ward, location, is_visible.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        ward:
          type: string
          format: uuid
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        is_visible:
          type: boolean
      required:
      - location
      - name
      - ward
    AgrodealerWrite:
      type: object
      description: |-
        Serializer for creating new agrodealers.
        Requires: name, user, ward, location.
        Address is auto-generated from location.
      properties:
        name:
          type: string
          maxLength: 30
        user:
          type: string
          format: uuid
        ward:
          type: string
          format: uuid
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
      required:
      - location
      - name
      - user
      - ward
    AgrodealerWriteRequest:
      type: object
      description: |-
        Serializer for creating new agrodealers.
        Requires: name, user, ward, location.
        Address is auto-generated from location.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        user:
          type: string
          format: uuid
        ward:
          type: string
          format: uuid
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
      required:
      - location
      - name
      - user
      - ward
    AuthToken:
      type: object
      properties:
        token:
          type: string
          readOnly: true
      required:
      - token
    AuthTokenRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    County:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        county_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: The unique number assigned to the county.
        name:
          type: string
          description: The unique name assigned to the county.
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - county_id
      - created_at
      - id
      - name
      - updated_at
    CountyRequest:
      type: object
      properties:
        county_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: The unique number assigned to the county.
        name:
          type: string
          minLength: 1
          description: The unique name assigned to the county.
          maxLength: 100
      required:
      - county_id
      - name
    EExtensionOfficerRead:
      type: object
      description: |-
        Serializer for reading/retrieving E-Extension officer data.
        Includes nested user, wards, and super extension information.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
