          readOnly: true
        super_extensions_count:
          type: integer
          readOnly: true
        managed_farms_count:
          type: integer
          readOnly: true
        is_visible:
          type: boolean
          description: If True, e-extension is visible to super extensionofficers
            allowed in their county
        is_archived:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_archived
