  /api/v2/app/agrodealers/:
    get:
      operationId: api_v2_app_agrodealers_list
      parameters:
      - in: query
        name: is_archived
        schema:
          type: boolean
      - in: query
        name: is_visible
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: string
      - in: query
        name: user_email
        schema:
          type: string
      - in: query
        name: ward
        schema:
          type: string
      - in: query
        name: ward_name
        schema:
          type: string
      tags:
      - App - Agrodealers
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgrodealerReadList'
          description: ''
    post:
      operationId: api_v2_app_agrodealers_create
      description: Create a new agrodealer profile with proper validation.
      tags:
      - App - Agrodealers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgrodealerWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgrodealerWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgrodealerWriteRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgrodealerWrite'
          description: ''
  /api/v2/app/agrodealers/{id}/:
    get:
      operationId: api_v2_app_agrodealers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Agro Dealer.
        required: true
      tags:
      - App - Agrodealers
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgrodealerRead'
          description: ''
    put:
      operationId: api_v2_app_agrodealers_update
      description: |-
        Update an agrodealer profile.
        Allows updating: name, ward, location, is_visible.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Agro Dealer.
        required: true
