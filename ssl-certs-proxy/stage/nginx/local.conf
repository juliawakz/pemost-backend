upstream pemostbackend_server {
    server backend_stage:8000;
}

server {
    listen 80;

    server_name geospatial.co.ke www.geospatial.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
    return 301 https://$host$request_uri;
    }
}

# Backend
server {
    listen              443 ssl;
    server_name         geospatial.co.ke www.geospatial.co.ke;

    ssl_certificate     /etc/nginx/sites/ssl/dummy/geospatial.co.ke/fullchain.pem;
    ssl_certificate_key /etc/nginx/sites/ssl/dummy/geospatial.co.ke/privkey.pem;
    ssl_dhparam /etc/nginx/sites/ssl/ssl-dhparams.pem;

    include /etc/nginx/includes/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Cache-Control 'no-cache, must-revalidate, proxy-revalidate, max-age=0';


    location / {
        proxy_pass http://pemostbackend_server;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1800; # Reducing this
        proxy_connect_timeout 1000;  # Adding this
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /static {
        alias /pemostbackend/static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /media {
        alias /pemostbackend/media/;
        add_header Access-Control-Allow-Origin *;
    }
}
