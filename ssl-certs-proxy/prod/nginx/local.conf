upstream pemostbackend_server {
    server backend_prod:8000;
}

upstream backend_ws_server {
    server sockets:6656;
}


server {
    listen 80;

    server_name api.pemost.georesearch.co.ke pemost.georesearch.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
    return 301 https://$host$request_uri;
    }
}

# Backend
server {
    listen              443 ssl;
    server_name         api.pemost.georesearch.co.ke;

    ssl_certificate     /etc/nginx/sites/ssl/dummy/pemost.georesearch.co.ke/fullchain.pem;
    ssl_certificate_key /etc/nginx/sites/ssl/dummy/pemost.georesearch.co.ke/privkey.pem;
    ssl_dhparam /etc/nginx/sites/ssl/ssl-dhparams.pem;

    include /etc/nginx/includes/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Cache-Control 'no-cache, must-revalidate, proxy-revalidate, max-age=0';


    location / {
        proxy_pass http://pemostbackend_server;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1800; # Reducing this
        proxy_connect_timeout 1000;  # Adding this
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_buffering off;
    }

     location /channel {
        proxy_pass http://backend_ws_server;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection Upgrade;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static {
        alias /pemostbackend/static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /media {
        alias /pemostbackend/media/;
        add_header Access-Control-Allow-Origin *;
    }
}

# frontend
server {
    server_name pemost.georesearch.co.ke;

    root /frontend;
    index index.html;
    location / {
        # First attempt to serve request as file, then
        # as directory, then redirect to index(angular) if no file found.
        try_files $uri $uri/ /index.html;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/nginx/sites/ssl/dummy/pemost.georesearch.co.ke/fullchain.pem;
    ssl_certificate_key /etc/nginx/sites/ssl/dummy/pemost.georesearch.co.ke/privkey.pem;
    ssl_dhparam /etc/nginx/sites/ssl/ssl-dhparams.pem;
    include /etc/nginx/includes/options-ssl-nginx.conf;


}
