name: Pemost CI/CD Pipeline

on:
  push:
    branches:
      - develop   # Deployment branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/pemost-backend
          docker build -t $IMAGE_NAME:latest ./backend
          docker push $IMAGE_NAME:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/v2/pemost_backend_v2
            git pull
            docker-compose -f docker-compose-prod.yml down --remove-orphans
            docker system prune -af
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pemost-backend:latest
            docker-compose -f docker-compose-prod.yml up -d
